services:
  yolo-web:
    build:
      context: ./web
    image: yolo-batch-web:1.0
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - yolo-api

  yolo-api:
    build:
      context: .
      network: host
    image: yolo-batch-service:1.0
    restart: unless-stopped
    command: uvicorn service.api:app --host 0.0.0.0 --port 8000
    user: "1000:1000"
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      MAX_UPLOAD_GB: "20"
      MAX_ARCHIVE_FILES: "100000"
      MAX_EXTRACT_GB: "100"
      MAX_ARCHIVE_FILE_GB: "10"
      MIN_DISK_FREE_GB: "10"
      MAX_COMPRESSION_RATIO: "100"
      DOWNLOAD_TOKEN_TTL_SECONDS: "300"
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy

  yolo-worker:
    image: yolo-batch-service:1.0
    restart: unless-stopped
    shm_size: "16gb"
    command: python -m service.worker
    user: "1000:1000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      MODEL_PATH: /data/models/yolo11n.pt
      MODEL_NAME: yolo11n.pt
      DEVICE: "0"
      IMGSZ: "640"
      BATCH_SIZE: "32"
      CONFIDENCE: "0.25"
      DATALOADER_WORKERS: "2"
      LEASE_SECONDS: "60"
      HEARTBEAT_SECONDS: "10"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy

  yolo-worker-2:
    image: yolo-batch-service:1.0
    restart: unless-stopped
    shm_size: "16gb"
    command: python -m service.worker
    user: "1000:1000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      MODEL_PATH: /data/models/yolo11n.pt
      MODEL_NAME: yolo11n.pt
      DEVICE: "0"
      IMGSZ: "640"
      BATCH_SIZE: "32"
      CONFIDENCE: "0.25"
      DATALOADER_WORKERS: "2"
      WORKER_ID: worker-2
      LEASE_SECONDS: "60"
      HEARTBEAT_SECONDS: "10"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy

  yolo-cleaner:
    image: yolo-batch-service:1.0
    restart: unless-stopped
    command: python -m service.cleaner
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      CLEANUP_INTERVAL_SECONDS: "300"
    volumes:
      - ./data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
